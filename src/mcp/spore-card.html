<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spore Locker</title>
  <style>
    :root{color-scheme:dark;font:13px/1.4 Inter,system-ui,sans-serif;color:#f3f1e8;background:#111512;--line:#343b33;--accent:#c5f779;--muted:#879084}
    *{box-sizing:border-box}body{margin:0;padding:10px}main{max-width:880px;margin:auto;border:1px solid var(--line);border-radius:14px;background:#151a16;overflow:hidden}
    header{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#10150f;font-weight:800}.title{flex:1}.title h1{font:21px Georgia,serif;margin:0}.title p{color:#737c72;margin:2px 0 0;font-size:9px}.new{border:0;background:var(--accent);color:#10150f;font-weight:800}
    button,input,select{font:inherit}button{border:1px solid #465044;border-radius:7px;background:#202620;color:#cbd1c8;padding:7px 9px;cursor:pointer;font-size:9px}button.active{color:var(--accent);border-color:#60794a}button:disabled{opacity:.5}
    #capture{display:none;padding:10px 15px;border-bottom:1px solid var(--line);gap:7px}#capture.open{display:flex}input,select{border:1px solid var(--line);border-radius:7px;background:#101411;color:#d4d9d1;padding:8px}#title{flex:1;min-width:0}
    .controls{display:flex;gap:6px;padding:9px 15px;border-bottom:1px solid var(--line);overflow-x:auto}.controls input{flex:1;min-width:150px}.controls select{font-size:9px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;padding:13px 15px 16px}.content{min-width:0}.group{margin-bottom:17px}.groupHead{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}.groupHead h2{font:17px Georgia,serif;margin:0}.count{color:#697268;font-size:8px;border:1px solid var(--line);border-radius:10px;padding:1px 5px}.project{margin:0 0 10px}.project>h3{color:#7f897d;font-size:8px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 6px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}.card{border:1px solid var(--line);border-radius:9px;background:#1b211c;padding:10px;min-height:132px;display:flex;flex-direction:column}.cardTop,.foot,.signal{display:flex;justify-content:space-between;align-items:center;gap:7px}.types{display:flex;gap:3px;flex-wrap:wrap}.type{color:var(--tag,#a9c798);border:1px solid var(--tag,#45533f);border-radius:9px;padding:2px 5px;font-size:7px;text-transform:uppercase;letter-spacing:.07em}.state{color:#707a6f;font-size:7px;text-transform:uppercase;white-space:nowrap}.card h4{margin:10px 0 4px;font-size:11px}.card p{margin:0;color:#7f887d;font-size:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.signal{margin-top:auto;padding:10px 0 7px;color:#899287;font-size:7px}.signal i{width:6px;height:6px;border-radius:50%;background:#8ec6ff}.signal b{margin-left:auto;color:#5d665d}.foot{border-top:1px solid #2b312b;padding-top:7px;color:#697268;font-size:7px}.foot strong{color:var(--accent);letter-spacing:.08em}.actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.actions button{padding:5px 7px;font-size:7px}.actions .primary{background:var(--accent);color:#10150f;border-color:var(--accent)}
    aside{border:1px solid var(--line);border-radius:9px;padding:11px;height:max-content;position:sticky;top:10px}.eyebrow{color:var(--accent);font-size:7px;letter-spacing:.14em;font-weight:800}.hero{font:34px Georgia,serif;color:var(--accent);margin:9px 0 0}.hero+span{display:block;color:#6f786e;font-size:7px;text-transform:uppercase}.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:11px}.stats span{border-top:1px solid var(--line);padding:7px 0;color:#717a70;font-size:7px}.stats b{display:block;color:#d0d5cc;font-size:12px}.railNote{border-top:1px solid var(--line);margin:8px 0 0;padding-top:8px;color:#687168;font-size:7px;line-height:1.5}
    .empty{color:#768075;border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center}#status{padding:0 15px 10px;color:#efb86b;font-size:8px;min-height:12px}
    @media(max-width:620px){body{padding:0}main{border:0;border-radius:0}.layout{grid-template-columns:1fr}aside{position:static;display:flex;align-items:center;gap:16px}.stats{display:flex;gap:15px;margin:0}.railNote{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:390px){.grid{grid-template-columns:1fr}.controls{flex-wrap:wrap}.controls input{width:100%}.title p{display:none}}
  </style>
</head>
<body><main>
  <header><div class="mark">S</div><div class="title"><h1>Spore Locker</h1><p>Shared local work, ordered your way.</p></div><button id="refresh">↻ Refresh</button><button id="new" class="new">+ New</button></header>
  <form id="capture"><input id="title" maxlength="200" required placeholder="Capture a task or idea…"><select id="captureProject"><option value="">Unsorted</option></select><select id="captureTag"><option value="">No tag</option></select><button class="new">Capture</button></form>
  <div class="controls"><input id="search" placeholder="Search cards"><select id="tagFilter"><option value="">All tags</option></select><select id="group"><option value="status">Group: Status</option><option value="classification">Group: Tag</option><option value="project">Group: Project</option></select><select id="then"><option value="project">Then: Project</option><option value="classification">Then: Tag</option><option value="status">Then: Status</option><option value="none">No second group</option></select><button id="reset">Reset</button><button id="active" class="active">Active</button><button id="archive">Archive</button></div>
  <div class="layout"><section class="content" id="groups"></section><aside><div class="eyebrow">WORKSPACE PULSE</div><div class="hero" id="total">0</div><span>visible cards</span><div class="stats"><span><b id="moving">0</b>Moving</span><span><b id="blocked">0</b>Blocked</span><span><b id="review">0</b>Review</span><span><b id="approved">0</b>Approved</span></div><p class="railNote">Ready for deeper cycle-time and project analytics later.</p></aside></div>
  <div id="status"></div>
</main>
<script type="module">
  const groupsEl=document.querySelector("#groups"),statusEl=document.querySelector("#status"),activeButton=document.querySelector("#active"),archiveButton=document.querySelector("#archive");
  let tasks=[],tags=[],projects=[],archived=false,rpcId=0;const pending=new Map();
  const labels={BACKLOG:"Inbox",READY:"Ready",IN_PROGRESS:"In progress",BLOCKED:"Blocked",DONE:"Complete",CANCELED:"Canceled"};
  const classify=t=>t.tags?.[0]?.name||"Untagged";
  const value=(t,k)=>k==="status"?labels[t.status]||t.status:k==="classification"?classify(t):k==="project"?t.projectKey||"Unsorted":"All work";
  const notify=(method,params)=>parent.postMessage({jsonrpc:"2.0",method,params},"*");
  const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")});
  addEventListener("message",event=>{if(event.source!==parent||event.data?.jsonrpc!=="2.0")return;const m=event.data;if(m.id!=null){const h=pending.get(m.id);if(!h)return;pending.delete(m.id);return m.error?h.reject(m.error):h.resolve(m.result)}if(m.method==="ui/notifications/tool-result")update(m.params)},{passive:true});
  const ready=request("ui/initialize",{appInfo:{name:"spore-locker-card",version:"0.4.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(()=>notify("ui/notifications/initialized",{}));
  function fillSelect(id,items,empty){const select=document.querySelector(id),value=select.value;select.replaceChildren(new Option(empty,""));for(const item of items)select.add(new Option(item.key?`${item.key} · ${item.name}`:item.name,item.id));select.value=value}
  function update(response){if(!response?.structuredContent?.tasks)return;tasks=response.structuredContent.tasks;tags=response.structuredContent.tags||[];projects=response.structuredContent.projects||[];archived=Boolean(response.structuredContent.archived);fillSelect("#tagFilter",tags,"All tags");fillSelect("#captureTag",tags,"No tag");fillSelect("#captureProject",projects,"Unsorted");render()}
  async function call(name,args={}){statusEl.textContent="Working…";try{await ready;const r=await request("tools/call",{name,arguments:args});update(r);statusEl.textContent=""}catch(e){statusEl.textContent=e?.message||"The action could not be completed."}}
  const action=(wrap,label,tool,args,primary=false)=>{const b=document.createElement("button");b.textContent=label;if(primary)b.className="primary";b.onclick=()=>call(tool,args);wrap.append(b)};
  function render(){
    activeButton.classList.toggle("active",!archived);archiveButton.classList.toggle("active",archived);
    const q=document.querySelector("#search").value.toLowerCase(),tag=document.querySelector("#tagFilter").value,first=document.querySelector("#group").value,second=document.querySelector("#then").value;
    const visible=tasks.filter(t=>(!tag||t.tags?.some(item=>item.id===tag))&&`${t.title} ${t.description||""} ${t.projectKey||""} ${(t.tags||[]).map(item=>item.name).join(" ")}`.toLowerCase().includes(q));
    document.querySelector("#total").textContent=visible.length;document.querySelector("#moving").textContent=visible.filter(t=>t.status==="IN_PROGRESS").length;document.querySelector("#blocked").textContent=visible.filter(t=>t.status==="BLOCKED").length;document.querySelector("#review").textContent=visible.filter(t=>t.status==="DONE"&&!t.approvedAt).length;document.querySelector("#approved").textContent=visible.filter(t=>t.approvedAt).length;
    groupsEl.innerHTML="";if(!visible.length){groupsEl.innerHTML=`<div class="empty">No cards match this view.</div>`;return}
    const grouped=new Map();for(const t of visible){const a=value(t,first),b=second==="none"||second===first?"All":value(t,second);if(!grouped.has(a))grouped.set(a,new Map());if(!grouped.get(a).has(b))grouped.get(a).set(b,[]);grouped.get(a).get(b).push(t)}
    for(const [a,nested]of grouped){const section=document.createElement("section");section.className="group";const count=[...nested.values()].flat().length;section.innerHTML=`<div class="groupHead"><h2>${a}</h2><span class="count">${count}</span></div>`;
      for(const [b,items]of nested){const project=document.createElement("div");project.className="project";if(b!=="All")project.innerHTML=`<h3>${b}</h3>`;const grid=document.createElement("div");grid.className="grid";
        for(const t of items){const card=document.createElement("article");card.className="card";const detail=document.createElement("div"),top=document.createElement("div"),types=document.createElement("div"),state=document.createElement("span"),heading=document.createElement("h4");top.className="cardTop";types.className="types";for(const tag of t.tags?.length?t.tags:[{name:"Untagged",color:"#718266"}]){const badge=document.createElement("span");badge.className="type";badge.textContent=tag.name;badge.style.setProperty("--tag",tag.color||"#718266");types.append(badge)}state.className="state";state.textContent=labels[t.status]||t.status;top.append(types,state);heading.textContent=t.title;detail.append(top,heading);if(t.description){const p=document.createElement("p");p.textContent=t.description;detail.append(p)}for(const link of (t.artifacts||[]).filter(item=>item.kind==="LINK"&&item.url)){const a=document.createElement("a");a.href=link.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=`↗ ${link.title}`;a.style.cssText="display:block;color:#8ec6ff;font-size:7px;margin-top:5px;overflow-wrap:anywhere";detail.append(a)}card.append(detail);
          const signal=document.createElement("div");signal.className="signal";signal.innerHTML=`<i></i><span>${t.approvedAt?"Approved":t.status==="DONE"?"Awaiting lifecycle decision":t.status==="BLOCKED"?"Needs a decision":"Activity recorded"}</span><b>v${t.version}</b>`;card.append(signal);
          const foot=document.createElement("div");foot.className="foot";foot.innerHTML=`<strong>${t.projectKey||"UNSORTED"}</strong><span>${t.priority}</span>`;card.append(foot);const actions=document.createElement("div");actions.className="actions";
          if(archived)action(actions,"Restore","restore_spore_task",{id:t.id,version:t.version});else if(t.approvedAt)action(actions,"Archive","archive_spore_task",{id:t.id,version:t.version});else if(t.status==="DONE")action(actions,"Approve","approve_spore_task",{id:t.id,version:t.version});else action(actions,"Mark complete","update_spore_task",{id:t.id,version:t.version,status:"DONE"});card.append(actions);grid.append(card)}
        project.append(grid);section.append(project)}groupsEl.append(section)}
  }
  document.querySelector("#new").onclick=()=>document.querySelector("#capture").classList.toggle("open");
  document.querySelector("#refresh").onclick=()=>call("list_spore_tasks",{archived});
  document.querySelector("#reset").onclick=()=>{document.querySelector("#search").value="";document.querySelector("#tagFilter").value="";document.querySelector("#group").value="status";document.querySelector("#then").value="project";render()};
  document.querySelector("#capture").onsubmit=async e=>{e.preventDefault();const input=document.querySelector("#title"),title=input.value.trim(),projectId=document.querySelector("#captureProject").value,tagId=document.querySelector("#captureTag").value;if(!title)return;await call("capture_spore_task",{title,...(projectId?{projectId}:{}),...(tagId?{tagIds:[tagId]}:{})});input.value="";e.currentTarget.classList.remove("open")};
  document.querySelector("#search").oninput=render;document.querySelector("#tagFilter").onchange=render;document.querySelector("#group").onchange=render;document.querySelector("#then").onchange=render;
  activeButton.onclick=()=>call("list_spore_tasks",{archived:false});archiveButton.onclick=()=>call("list_spore_tasks",{archived:true});render();
</script></body></html>
